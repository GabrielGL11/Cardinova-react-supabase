
name: CI/CD Cardinova

on:
  pull_request:
    branches:
      - devops-nube-practica
  push:
    branches:
      - 'feature/**'
      - devops-nube-practica

permissions:
  contents: read

env:
  AWS_REGION: us-east-2
  S3_BUCKET: cardinova-web-006209503558
  CLOUDFRONT_DISTRIBUTION_ID: E21DEXKSJWY4KJ

jobs:
  ci:
    name: Pruebas y compilación
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar ESLint
        run: npm run lint

      - name: Ejecutar pruebas unitarias
        run: npm test

      - name: Comprobar secretos de Supabase
        run: |
          [ -n "$URL" ] || { echo "FALTA VITE_SUPABASE_URL"; exit 1; }
          [ -n "$KEY" ] || { echo "FALTA VITE_SUPABASE_KEY"; exit 1; }
          echo "Secretos de Supabase presentes"
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_KEY }}

      - name: Compilar aplicación
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}

  deploy:
    name: Desplegar en AWS
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/devops-nube-practica'

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar aplicación
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Subir archivos a S3
        run: aws s3 sync dist s3://${{ env.S3_BUCKET }} --delete

      - name: Invalidar caché CloudFront
        run: aws cloudfront create-invalidation --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
